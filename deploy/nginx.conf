server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = / {
        default_type application/json;
        return 200 '{"message":"Microservices Gateway is running"}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"nginx-healthy"}';
    }

    location = /users {
        return 301 /users/;
    }

    location /users/ {
        proxy_pass http://user-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /products {
        return 301 /products/;
    }

    location /products/ {
        proxy_pass http://product-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /orders {
        return 301 /orders/;
    }

    location /orders/ {
        proxy_pass http://order-services:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
