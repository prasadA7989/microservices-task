
name: microdev

services:
  user-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/microdev-user:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - app-network

  product-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/microdev-product:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - app-network

  order-services:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/microdev-order:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "5000"
    expose:
      - "5000"
    networks:
      - app-network

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-services
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.6.0
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: "host"
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
